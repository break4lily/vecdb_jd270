[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "break4lily-vecdb_jd270"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对向量数据库内核工程师·尾延迟抖动与首 token 时间相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "break4lily" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://break4lily.github.io"
Repository = "https://github.com/break4lily/vecdb_jd270"
Issues = "https://github.com/break4lily/vecdb_jd270/issues"

[project.scripts]
vecdb_jd270 = "vecdb_jd270:main"

[tool.setuptools]
py-modules = ["vecdb_jd270"]
